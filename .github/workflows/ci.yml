name: Java CI with Maven & Pact Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven & Run Pact Contract Tests
      run: mvn -B clean verify

    - name: Upload Pact Contracts as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pact-contracts
        path: target/pacts/
